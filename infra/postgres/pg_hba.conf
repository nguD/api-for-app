# pg_hba.conf — authentification PostgreSQL (géré par git, pas de secret ici)
#
# Principe : tout est refusé par défaut. Chaque projet ajoute UN fichier
# hba.d/<projet>.conf (généré par scripts/create-project.sh) qui n'autorise que
# son utilisateur, sur sa base, depuis le sous-réseau Docker de son projet.
#
# TYPE   DATABASE   USER   ADDRESS   METHOD

# Socket Unix interne au conteneur (docker exec, healthcheck, initdb, sauvegardes).
# Le superutilisateur n'est joignable QUE par ce chemin, jamais par le réseau.
local    all        all              trust

# Règles par projet (include_dir : PostgreSQL >= 16)
include_dir /etc/postgresql/hba.d

# Tout le reste est refusé
host     all        all    all       reject
